}

.sub {

}

}
.prog-meta {

}

  height: 100%;

  box-shadow: 0 0 10px var(--gold-glow);
}

  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  animation: fadeInStep 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes fadeInStep {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

  font-weight: 700;

  letter-spacing: -0.2px;
}
.hint {

  font-size: 13.5px;

}

  {id:"price",hi:"Making charges",mr:"घडणावळ दर",en:"Making charges",f:{hi:"making charges me thoda aur discount milta toh badhiya tha",mr:"घडणावळीत आणखी थोडी सवलत मिळाली असती तर बरे झाले असते",en:"would appreciate a little more discount on making charges"}},
  {id:"variety",hi:"Aur designs",mr:"आणखी व्हरायटी",en:"More variety",f:{hi:"daily wear me thode aur naye designs dekhne the",mr:"आणखी काही नवे डिझाइन्स बघायला आवडतील",en:"would love to see even more daily wear designs"}},
  {id:"rush",hi:"Counter pe bheed",mr:"काउंटरवर गर्दी",en:"Counter rush",f:{hi:"festival rush ki wajah se counter pe thodi bheed thi",mr:"सणामुळे काउंटरवर बरीच गर्दी होती",en:"the counter was quite crowded during rush hours"}}
];

const VISITS = [
  {id:"first",hi:"Pehli baar visit kiya",mr:"पहिल्यांदाच भेट दिली",en:"First visit"},
  {id:"repeat",hi:"Hamare family jeweller hain",mr:"आमचे कौटुंबिक सराफ",en:"Family / Regular customer"},
  {id:"wedding",hi:"Shaadi / lagan ki shopping",mr:"लग्नाची / कार्याची खरेदी",en:"Wedding / Bridal shopping"},
  {id:"fest",hi:"Festival / Dhanteras",mr:"सण / धनत्रयोदशी",en:"Festival / Dhanteras"},
  {id:"gift",hi:"Kisi ko gift dene ke liye",mr:"भेटवस्तू देण्यासाठी",en:"Bought as a gift"}
];

const T = {
  hi:{title:"Aapka experience kaisa raha?",sub:"Sirf 30 second. Post karne se pehle review badal sakte hain.",
    q1:"Aapne kya liya?",h1:"Jo bhi liya ho select karein",q2:"Kya sabse achha laga?",h2:"Apne dil ki baat chunein",
    q3:"Aap humein kitne star denge?",h3:"Star pe tap karein",q4:"Kaisi visit thi?",h4:"Optional",
    q5:"Kya behtar ho sakta hai?",h5:"Optional",next:"Aage",back:"Peeche",gen:"Mera review banayein",wait:"Likh rahe hain...",
    final:"Aapka review",finalh:"Ye aapke jawabon se bana draft hai. Apne shabdon mein badal sakte hain.",
    regen:"Dobara likhein",copy:"Copy karein aur Google kholein",copied:"Copy ho gaya! Google page pe paste karein.",
    note:"Google mein sign in hona zaroori hai. Review tabhi post hota hai jab aap wahan Post dabate hain."},
  mr:{title:"तुमचा अनुभव कसा होता?",sub:"फक्त 30 सेकंद. पोस्ट करण्यापूर्वी रिव्ह्यू बदलता येईल.",
    q1:"तुम्ही काय खरेदी केले?",h1:"जे घेतले ते निवडा",q2:"काय सर्वात जास्त आवडले?",h2:"तुमच्या अनुभवानुसार निवडा",
    q3:"तुम्ही आम्हाला किती स्टार द्याल?",h3:"स्टारवर टॅप करा",q4:"कशी भेट होती?",h4:"ऐच्छिक",
    q5:"काय सुधारता येईल?",h5:"ऐच्छिक",next:"पुढे",back:"मागे",gen:"माझा रिव्ह्यू तयार करा",wait:"लिहित आहे...",
    final:"तुमचा रिव्ह्यू",finalh:"हा तुमच्या उत्तरांवरून तयार केलेला मसुदा आहे. तुमच्या शब्दांत बदला.",
    regen:"पुन्हा लिहा",copy:"कॉपी करा आणि Google उघडा",copied:"कॉपी झाले! Google पेजवर पेस्ट करा.",
    note:"Google मध्ये साइन इन असणे आवश्यक आहे. तुम्ही तिथे Post दाबल्यावरच रिव्ह्यू प्रकाशित होतो."},
  en:{title:"How was your visit?",sub:"Takes 30 seconds. You can edit the review before posting.",
    q1:"What did you buy?",h1:"Select all that apply",q2:"What stood out the most?",h2:"Pick what matches your personal experience",
    q3:"How would you rate us?",h3:"Tap a star",q4:"What kind of visit was it?",h4:"Optional",
    q5:"What could be better?",h5:"Optional",next:"Next",back:"Back",gen:"Create my review",wait:"Writing...",
    final:"Your review",finalh:"This is a draft from your answers. Change anything so it sounds like you.",
    regen:"Rewrite",copy:"Copy and open Google",copied:"Copied! Paste it on the Google page.",
    note:"You need to be signed in to Google. Your review is posted only when you tap Post there."}
};
const AND = {hi:" aur ",mr:" आणि ",en:" and "};

/* ============ STATE ============ */
const S = {lang:"hi",step:0,items:new Set(),likes:new Set(),stars:0,visit:null,improve:new Set(),text:""};
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const joinList = (a,l)=> a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+AND[l]+a.slice(-1);

/* ============ FALLBACK TEMPLATE GENERATOR ============ */
function buildReview(){
  const l=S.lang, shop=CONFIG.SHOP_NAME, st=S.stars, v=S.visit;
  const items=ITEMS.filter(i=>S.items.has(i.id)).map(i=>l==="en"?i.en.replace(/ \(.*\)/,"").toLowerCase():i[l].replace(/ \(.*\)/,""));
  const likes=LIKES.filter(x=>S.likes.has(x.id)).slice(0,3).map(x=>pick(x.f[l]));
  const imps=IMPROVE.filter(x=>S.improve.has(x.id)).map(x=>x.f[l]);
  const it=joinList(items,l);
  const OPEN={
    hi:{
      first:`Pehli baar ${shop} gaye the aur humne ${it} liya.`,
      repeat:`${shop} hamare purane family jeweller hain, is baar ${it} liya.`,
      wedding:`Ghar me shaadi thi to ${shop} se ${it} ki shopping ki.`,
      fest:`Festival ke shubh mauke par ${shop} se ${it} khareeda.`,
      gift:`Gift dene ke liye ${shop} se ${it} pasand kiya.`,
      def:`${shop} se ${it} khareeda.`
    },
    mr:{
      first:`पहिल्यांदाच ${shop} मध्ये गेलो आणि ${it} खरेदी केले.`,
      repeat:`${shop} आमचे नेहमीचे कौटुंबिक सराफ आहेत, यावेळी ${it} घेतले.`,
      wedding:`लग्नाच्या खरेदीसाठी ${shop} मधून ${it} घेतले.`,
      fest:`सणाच्या मुहूर्तावर ${shop} मधून ${it} खरेदी केले.`,
      gift:`भेट देण्यासाठी ${shop} मधून ${it} निवडले.`,
      def:`${shop} मधून ${it} खरेदी केले.`
    },
    en:{
      first:`Visited ${shop} for the first time and bought ${it}.`,
      repeat:`${shop} is our trusted family jeweller, bought ${it} this time.`,
      wedding:`Did our wedding shopping at ${shop} and picked up ${it}.`,
      fest:`Bought ${it} from ${shop} for the festive season.`,
      gift:`Selected ${it} as a special gift from ${shop}.`,
      def:`Bought ${it} from ${shop}.`
    }
  };
  const CLOSE={
    hi:{
      5:[
        "Bohot hi pyara experience raha, dil khush ho gaya. Radhika Jewellers zaroor visit karein!",
        "Murtizapur me jewellery lene ke liye best jagah hai, 100% recommend karunga.",
        "Aisa apnapan aur imaandar vyavhar har jagah nahi milta. Bohot shukriya!"
      ],
      4:[
        "Overall bohot achha experience raha, shopping se poora santosh hai.",
        "Badhiya designs aur achha vyavhar raha."
      ],
      3:["Overall theek tha, thode sudhaar ki gunjaish hai."],
      2:["Experience expectation se thoda kam raha."],
      1:["Main visit se satisfied nahi raha."]
    },
    mr:{
      5:[
        "खूपच समाधानकारक आणि प्रेमळ अनुभव आला. राधिका ज्वेलर्सला नक्की भेट द्या!",
        "मुर्तिजापूरमध्ये विश्वासू दागिने खरेदीसाठी सर्वात उत्तम सराफ, नक्की शिफारस करेन.",
        "असा प्रामाणिकपणा आणि आपलेपणा खूप आवडला. खूप खूप धन्यवाद!"
      ],
      4:[
        "एकंदरीत खूप चांगला अनुभव आला आणि खरेदीने पूर्ण समाधान झाले.",
        "छान डिझाइन्स आणि नम्र सेवा मिळाली."
      ],
      3:["एकंदरीत ठीक अनुभव, थोडी सुधारणा अपेक्षित आहे."],
      2:["अनुभव अपेक्षेपेक्षा थोडा कमी होता."],
      1:["मी या भेटीने समाधानी नाही."]
    },
    en:{
      5:[
        "Truly a heartwarming experience with genuine warmth and trust. Highly recommended!",
        "Best place for jewellery in Murtizapur, will definitely visit again.",
        "Loved the personal connection and purity. Thank you Radhika Jewellers!"
      ],
      4:[
        "Overall a very pleasant experience and happy with our purchase.",
        "Good collection, polite staff and satisfying visit."
      ],
      3:["Decent overall, with room to improve."],
      2:["The experience was below my expectations."],
      1:["I was not satisfied with my visit."]
    }
  };
  const SOFT={
    hi:[", lekin koi badi baat nahi.","Halanki "],
    mr:[", पण काही मोठी अडचण नाही.","तथापि, "],
    en:[", but nothing major.","However, "]
  };
  const out=[OPEN[l][v]||OPEN[l].def];
  if(likes.length) out.push((l==="en"?cap(joinList(likes,l)):joinList(likes,l))+".");
  if(imps.length){
    if(st>=4) out.push((l==="en"?cap(joinList(imps,l)):joinList(imps,l))+SOFT[l][0]);
    else out.push(SOFT[l][1]+joinList(imps,l)+".");
  }
  out.push(pick(CLOSE[l][st]));
  return out.join(" ").replace(/\.\./g,".");
}

// Pre-warm backend immediately when page opens
if(CONFIG.AI_ENDPOINT){
  try{ fetch(CONFIG.AI_ENDPOINT, {method:"GET", cache:"no-store"}).catch(()=>{}); }catch(e){}
}

async function makeReview(){
  if(CONFIG.AI_ENDPOINT){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(CONFIG.AI_ENDPOINT,{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},
        body:JSON.stringify({shop:CONFIG.SHOP_NAME,lang:S.lang,items:[...S.items],likes:[...S.likes],stars:S.stars,visit:S.visit,improve:[...S.improve]})});
      clearTimeout(to);
      if(r.ok){const j=await r.json(); if(j.review) return j.review;}
    }catch(e){}
  }
  return buildReview();
}

/* ============ UI ============ */
function chips(list,set,single){
  return `<div class="chips">`+list.map(x=>{
    const lbl=(x.e?x.e+" ":"")+x[S.lang];
    const on = single ? S[single]===x.id : set.has(x.id);
    return `<button class="chip ${on?"on":""}" data-id="${x.id}">${lbl}</button>`;}).join("")+`</div>`;
}
function steps(){const s=[0,1,2,3]; if(S.stars && S.stars<=3) s.push(4); return s;}
const STAR_LABELS = {
  hi: ["","Kharab experience","Thoda sudhaar chahiye","Theek tha","Bohot achha laga!","Dil se pasand aaya! ⭐⭐⭐⭐⭐"],
  mr: ["","असमाधानी अनुभव","सुधारणा हवी","ठीक अनुभव","खूप आवडले!","अतिशय उत्तम! ⭐⭐⭐⭐⭐"],
  en: ["","Poor experience","Needs improvement","Average","Very good!","Outstanding! ⭐⭐⭐⭐⭐"]
};
const STEP_WORD = {hi:"Step", mr:"पायरी", en:"Step"};

function render(){
  const t=T[S.lang];
  document.documentElement.lang = S.lang==="mr"?"mr":(S.lang==="hi"?"hi-Latn":"en");
  $("#title").textContent=t.title; $("#sub").textContent=t.sub;
  const seq=steps(), total=seq.length+1;
  const displayStep = Math.min(S.step+1, total);
  $("#step-label").textContent = STEP_WORD[S.lang];
  $("#step-num").textContent = `${displayStep} / ${total}`;
  $("#prog").style.width=Math.min(100,(S.step/total)*100+10)+"%";
  
  const box=$("#step"); let h="";
  const nav=(canNext,last)=>`<div class="row">${S.step>0?`<button class="btn ghost" id="back">${t.back}</button>`:""}<button class="btn" id="next" ${canNext?"":"disabled"}>${last?t.gen:t.next}</button></div>`;
  const cur=S.step<seq.length?seq[S.step]:99;
  const isLast = S.step===seq.length-1;

  if(cur===0){h=`<p class="q">${t.q1}</p><p class="hint">${t.h1}</p>`+chips(ITEMS,S.items)+nav(S.items.size>0,isLast)}
  else if(cur===1){h=`<p class="q">${t.q2}</p><p class="hint">${t.h2}</p>`+chips(LIKES,S.likes)+nav(S.likes.size>0,isLast)}
  else if(cur===2){
    const sLabel = STAR_LABELS[S.lang][S.stars] || "";
    h=`<p class="q">${t.q3}</p><p class="hint">${t.h3}</p>
       <div class="star-container">
         <div class="stars">`+[1,2,3,4,5].map(n=>`<span data-s="${n}" class="${n<=S.stars?"on":""}">★</span>`).join("")+`</div>
         <div class="star-label">${sLabel}</div>
       </div>`+nav(S.stars>0,isLast);
  }
  else if(cur===3){h=`<p class="q">${t.q4}</p><p class="hint">${t.h4}</p>`+chips(VISITS,null,"visit")+nav(true,isLast)}
  else if(cur===4){h=`<p class="q">${t.q5}</p><p class="hint">${t.h5}</p>`+chips(IMPROVE,S.improve)+nav(true,isLast)}
  else {
    h=`<div class="review-box-header">
         <p class="q" style="margin:0">${t.final}</p>
         <span class="review-pill">✨ Auto-Drafted</span>
       </div>
       <p class="hint">${t.finalh}</p>
       <textarea id="rv" spellcheck="false"></textarea>
       <div class="row">
         <button class="btn ghost" id="regen">${t.regen}</button>
         <button class="btn" id="copy"><span>${t.copy}</span> <span>→</span></button>
       </div>
       <p class="note">${t.note}</p>`
  }
  box.innerHTML=h;

  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(cur===0) toggle(S.items,id);
    else if(cur===1) toggle(S.likes,id);
    else if(cur===3) S.visit=S.visit===id?null:id;
    else if(cur===4) toggle(S.improve,id);
    render();
  });
  box.querySelectorAll(".stars span").forEach(s=>s.onclick=()=>{S.stars=+s.dataset.s;render()});
  if($("#back")) $("#back").onclick=()=>{S.step--;render()};
  if($("#next")) $("#next").onclick=async()=>{
    if(S.step+1>=steps().length){
      $("#next").disabled=true; $("#next").textContent=t.wait;
      S.text=await makeReview();
    }
    S.step++; render();
  };
  if(cur===99){
    $("#rv").value=S.text;
    $("#rv").oninput=e=>S.text=e.target.value;
    $("#regen").onclick=async()=>{
      const b=$("#regen"); b.disabled=true; b.textContent=t.wait;
      S.text=await makeReview(); $("#rv").value=S.text; b.disabled=false; b.textContent=t.regen;
    };
    $("#copy").onclick=copyAndGo;
  }
}
function toggle(set,id){set.has(id)?set.delete(id):set.add(id)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
async function copyAndGo(){
  const txt=$("#rv").value;
  try{await navigator.clipboard.writeText(txt)}catch(e){$("#rv").select();document.execCommand("copy")}
  toast(T[S.lang].copied);
  setTimeout(()=>window.open("https://search.google.com/local/writereview?placeid="+encodeURIComponent(CONFIG.PLACE_ID),"_blank"),700);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=async()=>{
  document.querySelectorAll(".lang button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  S.lang=b.dataset.l;
  if(S.step>=steps().length) S.text=await makeReview();
  render();
});
render();
</script>
</body>
</html>
